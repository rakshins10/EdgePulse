# Publish — Dashboard
#   • Push to main touching the dashboard → BETA image (:X.Y.Z-beta.N, :beta, :main, :sha-<commit>)
#   • Push tag `dashboard-v1.2.3`         → RELEASE image (:1.2.3, :1.2, :latest) + GitHub Release
# Next-version source: the "## [Unreleased]" line of src/EdgePulse.Dashboard/CHANGELOG.md
name: Publish — Dashboard

on:
  push:
    branches: [main]
    paths: ['src/EdgePulse.Dashboard/**']
    tags: ['dashboard-v*']

permissions:
  contents: write
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.m.outputs.channel }}
      version: ${{ steps.m.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags + full history for the beta number
      - id: m
        uses: ./.github/actions/component-version
        with:
          tag-prefix: dashboard
          changelog: src/EdgePulse.Dashboard/CHANGELOG.md
          paths: src/EdgePulse.Dashboard

  publish:
    needs: meta
    uses: ./.github/workflows/_publish-image.yml
    with:
      image: dashboard
      context: src/EdgePulse.Dashboard
      dockerfile: src/EdgePulse.Dashboard/Dockerfile
      channel: ${{ needs.meta.outputs.channel }}
      version: ${{ needs.meta.outputs.version }}
    secrets: inherit

  release:
    needs: [meta, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            && echo "Release ${{ github.ref_name }} already exists — skipping." \
            || gh release create "${{ github.ref_name }}" --title "Dashboard ${{ needs.meta.outputs.version }}" --generate-notes
