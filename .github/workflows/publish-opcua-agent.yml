# Publish — OPC-UA Agent
#   • Push to main touching the agent → BETA image (:main, :sha-<commit>)
#   • Push tag `opcua-agent-v1.2.3`   → RELEASE image (:1.2.3, :1.2, :latest) + GitHub Release
# Version source: src/EdgePulse.OpcUaAgent/package.json
name: Publish — OPC-UA Agent

on:
  push:
    branches: [main]
    paths: ['src/EdgePulse.OpcUaAgent/**']
    tags: ['opcua-agent-v*']

permissions:
  contents: write
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.m.outputs.channel }}
      version: ${{ steps.m.outputs.version }}
    steps:
      - id: m
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#opcua-agent-v}" >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: meta
    uses: ./.github/workflows/_publish-image.yml
    with:
      image: opcua-agent
      context: src/EdgePulse.OpcUaAgent
      dockerfile: src/EdgePulse.OpcUaAgent/Dockerfile
      channel: ${{ needs.meta.outputs.channel }}
      version: ${{ needs.meta.outputs.version }}
    secrets: inherit

  release:
    needs: [meta, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "OPC-UA Agent ${{ needs.meta.outputs.version }}" --generate-notes
