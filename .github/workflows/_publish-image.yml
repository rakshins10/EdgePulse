# ─────────────────────────────────────────────────────────────────────────────
# Reusable workflow: build one Docker image and push it to GHCR.
#
# Called by the per-component publish workflows. Centralises the tag logic:
#   - channel=beta    → :X.Y.Z-beta.N, :beta, :main, :sha-<short>   (rolling pre-release)
#   - channel=release → :X.Y.Z, :X.Y, :latest                       (a cut version)
#
# The caller always passes a fully-formed `version` (the beta number is computed
# upstream by the component-version action). Not meant to be run on its own.
# ─────────────────────────────────────────────────────────────────────────────
name: _publish-image

on:
  workflow_call:
    inputs:
      image:      { required: true,  type: string }   # suffix, e.g. "api" → edgepulse-api
      context:    { required: true,  type: string }   # docker build context
      dockerfile: { required: true,  type: string }   # path to the Dockerfile
      channel:    { required: true,  type: string }   # "beta" or "release"
      version:    { required: true,  type: string }   # X.Y.Z (release) or X.Y.Z-beta.N (beta)

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/edgepulse-${{ inputs.image }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          V="${{ inputs.version }}"
          if [ "${{ inputs.channel }}" = "release" ]; then
            MM="${V%.*}"   # major.minor (e.g. 0.1.0 → 0.1)
            TAGS="$IMG:$V
          $IMG:$MM
          $IMG:latest"
          else
            # beta, e.g. V=0.0.1-beta.3
            TAGS="$IMG:$V
          $IMG:beta
          $IMG:main
          $IMG:sha-$SHORT_SHA"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS" | sed 's/^[[:space:]]*//'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
