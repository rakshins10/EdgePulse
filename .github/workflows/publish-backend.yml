# ─────────────────────────────────────────────────────────────────────────────
# Publish — Backend (API + TelemetryProcessor)
#
# These two .NET services share the Domain/Application/Infrastructure libraries,
# so they version together as one "backend" line (source: src/backend/Directory.Build.props).
#
#   • Push to main touching backend code → BETA images (:X.Y.Z-beta.N, :beta, :main, :sha-<commit>)
#   • Push tag `backend-v1.2.3`          → RELEASE images (:1.2.3, :1.2, :latest)
#                                          + a GitHub Release
#
# Next-version source: the "## [Unreleased]" line of src/backend/CHANGELOG.md.
# ─────────────────────────────────────────────────────────────────────────────
name: Publish — Backend

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/EdgePulse.Domain/**'
      - 'src/backend/EdgePulse.Application/**'
      - 'src/backend/EdgePulse.Infrastructure/**'
      - 'src/backend/EdgePulse.API/**'
      - 'src/backend/EdgePulse.TelemetryProcessor/**'
      - 'src/backend/Directory.Build.props'
      - 'src/backend/CHANGELOG.md'
    tags: ['backend-v*']

permissions:
  contents: write     # create the GitHub Release on a tag
  packages: write     # push images to GHCR

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.m.outputs.channel }}
      version: ${{ steps.m.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags + full history for the beta number
      - id: m
        uses: ./.github/actions/component-version
        with:
          tag-prefix: backend
          changelog: src/backend/CHANGELOG.md
          paths: >-
            src/backend/EdgePulse.Domain src/backend/EdgePulse.Application src/backend/EdgePulse.Infrastructure
            src/backend/EdgePulse.API src/backend/EdgePulse.TelemetryProcessor src/backend/Directory.Build.props src/backend/CHANGELOG.md

  publish:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api,                 dockerfile: src/backend/EdgePulse.API/Dockerfile }
          - { name: telemetry-processor, dockerfile: src/backend/EdgePulse.TelemetryProcessor/Dockerfile }
    uses: ./.github/workflows/_publish-image.yml
    with:
      image: ${{ matrix.image.name }}
      context: .
      dockerfile: ${{ matrix.image.dockerfile }}
      channel: ${{ needs.meta.outputs.channel }}
      version: ${{ needs.meta.outputs.version }}
    secrets: inherit

  release:
    needs: [meta, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            && echo "Release ${{ github.ref_name }} already exists — skipping." \
            || gh release create "${{ github.ref_name }}" --title "Backend ${{ needs.meta.outputs.version }}" --generate-notes
