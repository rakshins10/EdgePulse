#------------------------------------------------------
# EdgePulse HAProxy Configuration
# On-premise deployment
# Stats dashboard: http://localhost:8404/stats
# Login: admin / edgepulse123
#------------------------------------------------------

global
    log stdout format raw local0
    maxconn 50000

defaults
    mode    http
    timeout connect  5s
    timeout client  30s
    timeout server  30s
    option  httplog
    option  forwardfor
    option  http-server-close
    option  redispatch
    retries 3

#------------------------------------------------------
# HAProxy Stats Dashboard
# Shows active/drain/inactive state per backend
#------------------------------------------------------
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node
    stats auth admin:edgepulse123

#------------------------------------------------------
# Main Entry Point
# Routes traffic to correct backend pool
#------------------------------------------------------
frontend edgepulse_frontend
    bind *:80

    # Route telemetry ingestion to telemetry pool
    acl is_telemetry  path_beg /api/telemetry
    acl is_telemetry  path_beg /api/ingest

    # Route identity to Keycloak
    acl is_auth       path_beg /auth

    use_backend keycloak_pool  if is_auth
    use_backend telemetry_pool if is_telemetry
    default_backend deviceapi_pool

#------------------------------------------------------
# Device API Backend Pool
# Add replicas here as you scale up
# Health check: GET /health every 5s
# fall 3  = 3 failed checks -> inactive
# rise 2  = 2 passed checks -> active again
#------------------------------------------------------
backend deviceapi_pool
    balance roundrobin
    option  httpchk GET /health
    http-check expect status 200
    default-server inter 5s fall 3 rise 2

    # Add more replicas as needed:
    # server device-api-2 device-api-2:5104 check
    server device-api-1 host.docker.internal:5104 check

#------------------------------------------------------
# Telemetry Service Backend Pool
# leastconn = route to server with fewest connections
# Better for high-volume unequal workloads
#------------------------------------------------------
backend telemetry_pool
    balance leastconn
    option  httpchk GET /health
    http-check expect status 200
    default-server inter 5s fall 3 rise 2

    server telemetry-1 host.docker.internal:3000 check

#------------------------------------------------------
# Keycloak Backend Pool
#------------------------------------------------------
backend keycloak_pool
    balance roundrobin
    option  httpchk GET /health/ready
    http-check expect status 200
    default-server inter 10s fall 3 rise 2

    server keycloak-1 keycloak:8080 check
